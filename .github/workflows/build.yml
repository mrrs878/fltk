name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install cmake

    - name: Cache FLTK build
      uses: actions/cache@v4
      with:
        path: fltk_src/build
        key: ${{ runner.os }}-fltk-${{ hashFiles('fltk_src/CMakeLists.txt') }}

    - name: Build FLTK
      run: |
        cd fltk_src
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_TEST=OFF
        make -j$(sysctl -n hw.ncpu)

    - name: Build application
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)

    - name: Package macOS App
      run: |
        ./package_app.sh
        mkdir -p dist
        cp -r build/HelloFLTK.app dist/
        cd dist
        zip -r HelloFLTK-macOS.zip HelloFLTK.app

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloFLTK-macOS
        path: dist/HelloFLTK-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache FLTK build
      uses: actions/cache@v4
      with:
        path: fltk_src/build
        key: ${{ runner.os }}-fltk-${{ hashFiles('fltk_src/CMakeLists.txt') }}

    - name: Build FLTK
      run: |
        cd fltk_src
        if (-not (Test-Path build)) { mkdir build }
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_TEST=OFF
        cmake --build . --config Release --parallel

    - name: Build application
      run: |
        if (-not (Test-Path build)) { mkdir build }
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --parallel

    - name: Package Windows binary
      run: |
        if (Test-Path build/Release/hello_fltk.exe) {
          Compress-Archive -Path build/Release/hello_fltk.exe -DestinationPath HelloFLTK-Windows.zip
        } else {
          Compress-Archive -Path build/hello_fltk.exe -DestinationPath HelloFLTK-Windows.zip
        }

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloFLTK-Windows
        path: HelloFLTK-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          HelloFLTK-macOS/HelloFLTK-macOS.zip
          HelloFLTK-Windows/HelloFLTK-Windows.zip