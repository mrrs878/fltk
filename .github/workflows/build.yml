name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install dependencies
      run: brew install cmake

    - name: Build application
      run: |
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
        make -j$(sysctl -n hw.ncpu)

    - name: Package macOS binary
      run: |
        mkdir -p dist
        # Ad-hoc sign the application to avoid "damaged" error
        codesign --force --deep --sign - build/quick_adb.app
        # Remove quarantine attribute
        xattr -cr build/quick_adb.app
        cp -r build/quick_adb.app dist/
        cd dist
        zip -r QuickADB-macOS.zip quick_adb.app

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickADB-macOS
        path: dist/QuickADB-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install NuGet packages
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory packages

    - name: Build application
      run: |
        if (-not (Test-Path build)) { mkdir build }
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --parallel

    - name: Package Windows binary
      run: |
        mkdir -p dist
        if (Test-Path build/Release/quick_adb.exe) {
          Copy-Item build/Release/quick_adb.exe dist/
          # Copy frontend and resources from build output
          if (Test-Path build/Release/frontend) {
            Copy-Item -Recurse build/Release/frontend dist/
          }
          if (Test-Path build/Release/resources) {
            Copy-Item -Recurse build/Release/resources dist/
          }
          # Copy WebView2Loader.dll if exists
          if (Test-Path packages/Microsoft.Web.WebView2.*/build/native/x64/WebView2Loader.dll) {
            Copy-Item (Get-Item packages/Microsoft.Web.WebView2.*/build/native/x64/WebView2Loader.dll).FullName dist/
          }
          Compress-Archive -Path dist/* -DestinationPath QuickADB-Windows.zip
        } else {
          Copy-Item build/quick_adb.exe dist/
          if (Test-Path build/frontend) {
            Copy-Item -Recurse build/frontend dist/
          }
          if (Test-Path build/resources) {
            Copy-Item -Recurse build/resources dist/
          }
          Compress-Archive -Path dist/* -DestinationPath QuickADB-Windows.zip
        }

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickADB-Windows
        path: QuickADB-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          QuickADB-macOS/QuickADB-macOS.zip
          QuickADB-Windows/QuickADB-Windows.zip