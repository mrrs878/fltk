name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install cmake

    - name: Cache FLTK build
      uses: actions/cache@v4
      with:
        path: fltk_src/build
        key: ${{ runner.os }}-fltk-${{ hashFiles('fltk_src/CMakeLists.txt') }}

    - name: Build FLTK
      run: |
        cd fltk_src
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_TEST=OFF
        make -j$(sysctl -n hw.ncpu)

    - name: Build application
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)

    - name: Package macOS App
      run: |
        ./package_app.sh
        mkdir -p dist
        cp -r build/HelloFLTK.app dist/
        cd dist
        zip -r HelloFLTK-macOS.zip HelloFLTK.app

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloFLTK-macOS
        path: dist/HelloFLTK-macOS.zip

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxft-dev libxinerama-dev libxcursor-dev libpng-dev libjpeg-dev cmake build-essential

    - name: Cache FLTK build
      uses: actions/cache@v4
      with:
        path: fltk_src/build
        key: ${{ runner.os }}-fltk-${{ hashFiles('fltk_src/CMakeLists.txt') }}

    - name: Build FLTK
      run: |
        cd fltk_src
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_TEST=OFF
        make -j$(nproc)

    - name: Build application
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Package Ubuntu binary
      run: |
        mkdir -p dist
        cp build/hello_fltk dist/
        cd dist
        tar -czvf HelloFLTK-ubuntu.tar.gz hello_fltk

    - name: Upload Ubuntu artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloFLTK-ubuntu
        path: dist/HelloFLTK-ubuntu.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache FLTK build
      uses: actions/cache@v4
      with:
        path: fltk_src/build
        key: ${{ runner.os }}-fltk-${{ hashFiles('fltk_src/CMakeLists.txt') }}

    - name: Build FLTK
      run: |
        cd fltk_src
        mkdir -Force build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_EXAMPLES=OFF -DFLTK_BUILD_TEST=OFF
        cmake --build . --config Release --parallel

    - name: Build application
      run: |
        mkdir -Force build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --parallel

    - name: Package Windows binary
      run: |
        mkdir -Force dist
        cp build/Release/hello_fltk.exe dist/ -ErrorAction SilentlyContinue
        if (-not $?) { cp build/hello_fltk.exe dist/ }
        cd dist
        Compress-Archive -Path * -DestinationPath ../HelloFLTK-Windows.zip

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloFLTK-Windows
        path: dist/HelloFLTK-Windows.zip

  release:
    needs: [build-macos, build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          HelloFLTK-macOS/HelloFLTK-macOS.zip
          HelloFLTK-ubuntu/HelloFLTK-ubuntu.tar.gz
          HelloFLTK-Windows/HelloFLTK-Windows.zip