name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Install dependencies
      run: brew install cmake

    - name: Build application
      run: |
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
        make -j$(sysctl -n hw.ncpu)

    - name: Package macOS binary
      run: |
        mkdir -p dist
        # Ad-hoc sign the application
        codesign --force --deep --sign - build/quick_adb.app
        
        # Create installation script
        cat > dist/install.command << 'EOF'
        #!/bin/bash
        cd "$(dirname "$0")"
        echo "Removing quarantine attribute from quick_adb.app..."
        xattr -cr quick_adb.app
        echo "Done! You can now open quick_adb.app by double-clicking it."
        echo "Press any key to close this window..."
        read -n 1
        EOF
        chmod +x dist/install.command
        
        # Copy app to dist
        cp -r build/quick_adb.app dist/
        
        # Create README
        cat > dist/README.txt << 'EOF'
        QuickADB macOS 安装说明
        ======================

        如果遇到"应用已损坏"错误，请执行以下操作：

        方法一（推荐 - 自动）：
        1. 双击运行 install.command 脚本
        2. 然后就可以正常打开 quick_adb.app

        方法二（手动）：
        1. 打开终端（Terminal）
        2. 输入：xattr -cr 
        3. 将 quick_adb.app 拖拽到终端窗口
        4. 按回车执行

        方法三（右键打开）：
        1. 右键点击 quick_adb.app
        2. 选择"打开"
        3. 在弹出对话框中点击"打开"
        EOF
        
        cd dist
        zip -r QuickADB-macOS.zip quick_adb.app install.command README.txt

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickADB-macOS
        path: dist/QuickADB-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install NuGet packages
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory packages

    - name: Build application
      run: |
        if (-not (Test-Path build)) { mkdir build }
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --parallel

    - name: Package Windows binary
      run: |
        mkdir -p dist
        if (Test-Path build/Release/quick_adb.exe) {
          Copy-Item build/Release/quick_adb.exe dist/
          # Copy frontend and resources from build output
          if (Test-Path build/Release/frontend) {
            Copy-Item -Recurse build/Release/frontend dist/
          }
          if (Test-Path build/Release/resources) {
            Copy-Item -Recurse build/Release/resources dist/
          }
          # Copy WebView2Loader.dll if exists
          if (Test-Path packages/Microsoft.Web.WebView2.*/build/native/x64/WebView2Loader.dll) {
            Copy-Item (Get-Item packages/Microsoft.Web.WebView2.*/build/native/x64/WebView2Loader.dll).FullName dist/
          }
          Compress-Archive -Path dist/* -DestinationPath QuickADB-Windows.zip
        } else {
          Copy-Item build/quick_adb.exe dist/
          if (Test-Path build/frontend) {
            Copy-Item -Recurse build/frontend dist/
          }
          if (Test-Path build/resources) {
            Copy-Item -Recurse build/resources dist/
          }
          Compress-Archive -Path dist/* -DestinationPath QuickADB-Windows.zip
        }

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickADB-Windows
        path: QuickADB-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          QuickADB-macOS/QuickADB-macOS.zip
          QuickADB-Windows/QuickADB-Windows.zip